<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunts</title>
<style>
body{font-family:system-ui,sans-serif;background:#1c1b18;color:#eee;max-width:900px;margin:auto;padding:20px}
a{color:inherit;text-decoration:none}
.back{opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#2a2925;border-radius:10px;overflow:hidden}
.card img{width:100%;height:160px;object-fit:cover;display:block}
.card div{padding:10px;font-weight:600}
</style></head><body>
<a class="back" href="../">&larr; All species</a>
<h1 id="t"></h1>
<div class="grid" id="g"></div>
<script>
const p=location.pathname.split('/').filter(Boolean);
const user=location.hostname.split('.')[0], repo=p[0], species=p[1];
const pretty=s=>s.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
document.getElementById('t').textContent=pretty(species);
document.title=pretty(species);
const g=document.getElementById('g');
fetch(`https://api.github.com/repos/${user}/${repo}/contents/${species}`)
.then(r=>r.json())
.then(items=>{
  const hunts=items.filter(i=>i.type==='dir'&&/^\d{4}-/.test(i.name)).map(i=>i.name).sort().reverse();
  if(!hunts.length){g.textContent='No hunts yet.';return}
  hunts.forEach(name=>{
    const a=document.createElement('a');
    a.href=name+'/';a.className='card';
    a.innerHTML=`<div>${pretty(name)}</div>`;
    g.appendChild(a);
    fetch(name+'/hunt.json').then(r=>r.json()).then(h=>{
      if(h.photos&&h.photos[0]){
        const i=document.createElement('img');
        i.src=name+'/'+h.photos[0];
        a.prepend(i);
      }
    }).catch(()=>{});
  });
}).catch(()=>{g.textContent='Could not load list.'});
</script></body></html>
